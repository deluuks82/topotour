<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    background: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 14px;
  }
  h1 { font-size: 13px; font-weight: 700; color: #818180; letter-spacing: .1em; margin-bottom: 10px; text-transform: uppercase; }
  #mode-btns { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  .mode-btn {
    font-weight: 700; font-size: 12.5px;
    border: 2px solid #E8112D; color: #E8112D; background: #fff;
    border-radius: 20px; padding: 5px 15px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .mode-btn.active, .mode-btn:hover { background: #E8112D; color: #fff; }
  #score-bar { font-size: 13px; color: #818180; margin-bottom: 6px; }
  #score-bar b { color: #E8112D; }
  #target-banner {
    background: #E8112D; color: #fff; font-weight: 700; font-size: 20px;
    padding: 10px 32px; border-radius: 32px; margin-bottom: 10px;
    text-align: center; min-width: 280px; box-shadow: 0 2px 14px #E8112D44;
  }
  #progress-dots { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #CFCFCF; transition: background .3s; }
  .dot.done { background: #E8112D; }
  #hint-btn {
    font-size: 12px; color: #E8112D; background: none;
    border: 1.5px solid #FF9AA2; border-radius: 14px;
    padding: 4px 14px; cursor: pointer; margin-bottom: 8px;
  }
  #hint-btn:hover { background: #FFE4E6; }

  @media (max-width: 560px) {
    .mode-btn { font-size: 13px; padding: 8px 16px; }
    #hint-btn { font-size: 13px; padding: 8px 16px; }
    #target-banner { font-size: 18px; padding: 10px 22px; min-width: 0; }
  }
  #game-area {
    position: relative;
    width: min(470px, calc(100vw - 28px));
    aspect-ratio: 736 / 832;
  }
  #map-svg { width: 100%; height: 100%; display: block; }

  /* Provinces and countries keep their colour permanently */
  .prov, .country {
    stroke: #ffffff; stroke-width: 1.8;
    stroke-linejoin: round; stroke-linecap: round;
    cursor: pointer; transition: filter .15s;
  }
  .prov:hover, .country:hover { filter: brightness(1.12); }
  .country { stroke: none; }

  .marker { cursor: pointer; }
  #map-svg { touch-action: manipulation; }
  .cap-dot  { fill: #000000; stroke: #fff; stroke-width: 2.5; }
  .cap-ring { fill: none; stroke: #fff; stroke-width: 1.3; opacity: .85; pointer-events: none; }
  .place-dot { fill: #000000; stroke: #fff; stroke-width: 2; }
  .place-sq  { fill: #000000; stroke: #fff; stroke-width: 2; }

  #heli-wrap { position: absolute; width: 80px; height: 60px; pointer-events: none; z-index: 12; transform: translate(-50%,-50%); }
  #heli-svg { width: 80px; height: 60px; overflow: visible; }
  @keyframes rotor-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .main-rotor { transform-origin: 39px 10px; animation: rotor-spin .18s linear infinite; }
  .tail-rotor { transform-origin: 74px 36px; animation: rotor-spin .12s linear infinite; }
  @keyframes hover-bob {
    0%,100% { transform: translate(-50%,-50%) translateY(0); }
    50%     { transform: translate(-50%,-50%) translateY(-4px); }
  }
  #heli-wrap.hovering { animation: hover-bob 1.2s ease-in-out infinite; }
  #heli-shadow {
    position: absolute; width: 46px; height: 12px;
    background: radial-gradient(ellipse, rgba(0,0,0,.22) 0%, transparent 78%);
    border-radius: 50%; pointer-events: none; z-index: 11; transform: translate(-50%,-50%);
  }
  #trail-canvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
  #feedback {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
    font-weight: 700; font-size: 21px; background: #fff;
    border-radius: 16px; padding: 10px 26px; box-shadow: 0 4px 24px #E8112D33;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 24; white-space: nowrap;
  }
  canvas#confetti { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:20; }
  #credit { font-size: 10px; color: #818180; margin-top: 8px; letter-spacing: .02em; }
  #credit a { color: #818180; text-decoration: none; border-bottom: 1px solid #CFCFCF; }
  #credit a:hover { color: #E8112D; border-bottom-color: #E8112D; }
  #win-screen { display: none; flex-direction: column; align-items: center; gap: 14px; padding: 30px; text-align: center; }
  #win-screen h2 { color: #E8112D; font-size: 27px; }
  #win-screen p { color: #818180; font-size: 15px; max-width: 380px; }
  #restart-btn {
    background: #E8112D; color: #fff; font-weight: 700; font-size: 15px;
    border: none; border-radius: 24px; padding: 12px 34px; cursor: pointer;
  }
  #restart-btn:hover { background: #A3061B; }
</style>

<script>
const PROVINCES = ["Groningen","Friesland","Drenthe","Overijssel","Gelderland","Flevoland",
                   "Noord-Holland","Zuid-Holland","Utrecht","Zeeland","Noord-Brabant","Limburg"];
const CAPITALS  = ["Groningen","Leeuwarden","Assen","Zwolle","Arnhem","Lelystad","Haarlem",
                   "Den Haag","Utrecht","Middelburg","'s-Hertogenbosch","Maastricht"];
const PLACES    = ["Rotterdam","Enschede","Eindhoven","Schiphol"];
const COUNTRIES = ["Duitsland","Belgie"];

const DISPLAY = { "Belgie": "Belgi\u00EB" };
function label(n){ return DISPLAY[n] || n; }

const LABEL_BY_TYPE = {
  province: "Provincie",
  city:     "Hoofdstad",
  place:    "Plaats",
  country:  "Land"
};

let mode='provinces', targets=[], currentIdx=0, foundCount=0, points=0;
let activeTypes=new Set();

const heliWrap=document.getElementById('heli-wrap');
const heliShadow=document.getElementById('heli-shadow');
const gameArea=document.getElementById('game-area');
const winScreen=document.getElementById('win-screen');
const feedback=document.getElementById('feedback');
const confettiCv=document.getElementById('confetti');
const confettiCx=confettiCv.getContext('2d');
const trailCv=document.getElementById('trail-canvas');
const trailCx=trailCv.getContext('2d');

let particles=[], confAnimId=null;
let heliX=235, heliY=266, heliTargetX=235, heliTargetY=266, isFlying=false;
let trailPoints=[];

function initCanvases(){
  trailCv.width=gameArea.offsetWidth; trailCv.height=gameArea.offsetHeight;
  confettiCv.width=gameArea.offsetWidth; confettiCv.height=gameArea.offsetHeight;
}
function drawTrail(){
  trailCx.clearRect(0,0,trailCv.width,trailCv.height);
  for(let i=1;i<trailPoints.length;i++){
    const a=trailPoints[i-1], b=trailPoints[i];
    const al=Math.max(0,1-b.age/38);
    trailCx.beginPath(); trailCx.moveTo(a.x,a.y); trailCx.lineTo(b.x,b.y);
    trailCx.strokeStyle='rgba(232,17,45,'+(al*0.38)+')';
    trailCx.lineWidth=3*al; trailCx.lineCap='round'; trailCx.stroke();
  }
  trailPoints.forEach(p=>p.age++);
  trailPoints=trailPoints.filter(p=>p.age<38);
}
function heliLoop(){
  const dx=heliTargetX-heliX, dy=heliTargetY-heliY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>1.5){
    const sp=Math.min(dist*0.12,18);
    heliX+=dx/dist*sp; heliY+=dy/dist*sp;
    const tilt=Math.max(-22,Math.min(22,dx/dist*20));
    heliWrap.style.transform='translate(-50%,-50%) rotate('+tilt.toFixed(1)+'deg)';
    trailPoints.push({x:heliX,y:heliY,age:0});
    isFlying=true; heliWrap.classList.remove('hovering');
  } else if(isFlying){
    heliX=heliTargetX; heliY=heliTargetY; isFlying=false;
    heliWrap.style.transform='translate(-50%,-50%) rotate(0deg)';
    heliWrap.classList.add('hovering');
  }
  heliWrap.style.left=heliX+'px'; heliWrap.style.top=heliY+'px';
  heliShadow.style.left=heliX+'px'; heliShadow.style.top=(heliY+26)+'px';
  drawTrail();
  requestAnimationFrame(heliLoop);
}
function moveHeli(x,y){ heliTargetX=x; heliTargetY=y; }

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTargets(){
  if(mode==='provinces') return PROVINCES.map(n=>({name:n,type:'province'}));
  if(mode==='capitals')  return CAPITALS.map(n=>({name:n,type:'city'}));
  if(mode==='extra')     return PLACES.map(n=>({name:n,type:'place'}))
                                .concat(COUNTRIES.map(n=>({name:n,type:'country'})));
  return PROVINCES.map(n=>({name:n,type:'province'}))
    .concat(CAPITALS.map(n=>({name:n,type:'city'})))
    .concat(PLACES.map(n=>({name:n,type:'place'})))
    .concat(COUNTRIES.map(n=>({name:n,type:'country'})));
}
function setMode(m,btn){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); startGame();
}
function startGame(){
  targets=shuffle(buildTargets());
  /* Markers laten tikken alleen door als ze in deze spelvorm een doel zijn.
     Anders zou je in de stand 'Provincies' een provincie missen omdat je vinger
     te dicht bij een stad zat. */
  activeTypes=new Set(targets.map(t=>t.type));
  document.querySelectorAll('.marker').forEach(g=>{
    g.style.pointerEvents=activeTypes.has(g.dataset.type)?'auto':'none';
  });
  currentIdx=0; foundCount=0; points=0;
  winScreen.style.display='none';
  gameArea.style.display='block';
  document.getElementById('credit').style.display='block';
  document.getElementById('target-banner').style.display='block';
  document.getElementById('hint-btn').style.display='inline-block';
  document.querySelectorAll('.prov,.country,.cap-dot,.place-dot,.place-sq')
    .forEach(e=>{ e.style.filter=''; });
  trailPoints=[]; initCanvases(); updateUI();
}
function updateUI(){
  document.getElementById('score').textContent=foundCount;
  document.getElementById('total').textContent=targets.length;
  document.getElementById('points').textContent=points;
  if(currentIdx<targets.length){
    const t=targets[currentIdx];
    document.getElementById('target-banner').textContent=
      LABEL_BY_TYPE[t.type]+': '+label(t.name);
  }
  const d=document.getElementById('progress-dots'); d.innerHTML='';
  targets.forEach((_,i)=>{const e=document.createElement('div');e.className='dot'+(i<currentIdx?' done':'');d.appendChild(e);});
}
function getSVGCenter(el){
  const svg=document.getElementById('map-svg');
  const sr=svg.getBoundingClientRect(), gr=gameArea.getBoundingClientRect();
  const vb=svg.viewBox.baseVal;
  const sx=sr.width/vb.width, sy=sr.height/vb.height;
  let ux, uy;
  if(el.dataset && el.dataset.cx!==undefined){
    ux=parseFloat(el.dataset.cx); uy=parseFloat(el.dataset.cy);
  } else {
    const bb=el.getBBox();
    ux=bb.x+bb.width/2; uy=bb.y+bb.height/2;
  }
  return {
    x:(ux-vb.x)*sx+(sr.left-gr.left),
    y:(uy-vb.y)*sy+(sr.top-gr.top)
  };
}
function showFeedback(msg,good){
  feedback.textContent=msg;
  feedback.style.color=good?'#E8112D':'#818180';
  feedback.style.opacity='1';
  setTimeout(()=>{feedback.style.opacity='0';},1000);
}
function findTargetEl(t){
  if(t.type==='province') return document.querySelector('.prov[data-name="'+t.name+'"]');
  if(t.type==='country')  return document.querySelector('.country[data-name="'+t.name+'"]');
  const g=document.querySelector('.marker[data-name="'+t.name+'"]');
  return g ? g.firstElementChild : null;
}
function flashHint(){
  if(currentIdx>=targets.length) return;
  const el=findTargetEl(targets[currentIdx]);
  if(!el) return;
  [0,450,900].forEach((d,i)=>setTimeout(()=>{
    el.style.filter = i%2===0 ? 'brightness(1.9) saturate(0.2)' : '';
  },d));
  setTimeout(()=>{el.style.filter='';},1350);
}
function showHint(){ points=Math.max(0,points-3); updateUI(); flashHint(); }

function launchConfetti(){
  initCanvases(); particles=[];
  const cols=['#E8112D','#A3061B','#5C0011','#FF9AA2','#FFE4E6','#000000'];
  for(let i=0;i<90;i++) particles.push({
    x:Math.random()*confettiCv.width, y:-20-Math.random()*confettiCv.height*0.3,
    r:4+Math.random()*5, color:cols[Math.floor(Math.random()*cols.length)],
    dx:(Math.random()-.5)*4, dy:2+Math.random()*5,
    rot:Math.random()*360, drot:(Math.random()-.5)*10
  });
  if(confAnimId) cancelAnimationFrame(confAnimId);
  animConf();
  setTimeout(()=>{cancelAnimationFrame(confAnimId);confettiCx.clearRect(0,0,confettiCv.width,confettiCv.height);},2200);
}
function animConf(){
  confettiCx.clearRect(0,0,confettiCv.width,confettiCv.height);
  particles.forEach(p=>{
    confettiCx.save(); confettiCx.translate(p.x,p.y); confettiCx.rotate(p.rot*Math.PI/180);
    confettiCx.fillStyle=p.color; confettiCx.beginPath();
    confettiCx.ellipse(0,0,p.r,p.r*.5,0,0,2*Math.PI); confettiCx.fill(); confettiCx.restore();
    p.x+=p.dx; p.y+=p.dy; p.rot+=p.drot;
  });
  confAnimId=requestAnimationFrame(animConf);
}
function handleHit(shapeEl,name,type){
  if(currentIdx>=targets.length) return;
  const t=targets[currentIdx];
  const c=getSVGCenter(shapeEl);
  moveHeli(c.x,c.y);
  if(t.name===name && t.type===type){
    points+=10; foundCount++;
    showFeedback('Gevonden! +10',true);
    launchConfetti(); currentIdx++;
    setTimeout(()=>{updateUI(); if(currentIdx>=targets.length) setTimeout(showWin,600);},900);
  } else {
    points=Math.max(0,points-2);
    showFeedback('Niet die! \u22122',false);
    updateUI();
  }
}
function showWin(){
  gameArea.style.display='none';
  document.getElementById('credit').style.display='none';
  document.getElementById('target-banner').style.display='none';
  document.getElementById('hint-btn').style.display='none';
  winScreen.style.display='flex';
  document.getElementById('win-msg').textContent=
    'Je hebt alle '+targets.length+' gebieden gevonden met '+points+' punten. Jij kent Nederland nu van boven!';
}
function restartGame(){ startGame(); }

/* Stadsstippen zijn maar een paar pixels groot, zeker op een telefoon.
   In plaats van precies op de stip te moeten tikken, zoeken we de marker die
   het dichtst bij je vinger zit. De marge rekenen we om naar beeldpunten, zodat
   het tikgebied op elk schermformaat ongeveer even groot aanvoelt. */
const mapSvg=document.getElementById('map-svg');
const TAP_RADIUS_PX=24;

const MARKERS=[...document.querySelectorAll('.marker')].map(g=>{
  const el=g.firstElementChild;
  let x,y;
  if(el.tagName.toLowerCase()==='rect'){
    x=parseFloat(el.getAttribute('x'))+parseFloat(el.getAttribute('width'))/2;
    y=parseFloat(el.getAttribute('y'))+parseFloat(el.getAttribute('height'))/2;
  } else {
    x=parseFloat(el.getAttribute('cx'));
    y=parseFloat(el.getAttribute('cy'));
  }
  return {el:el,x:x,y:y,name:g.dataset.name,type:g.dataset.type};
});

function toUserSpace(evt){
  const ctm=mapSvg.getScreenCTM();
  if(!ctm) return null;
  const pt=mapSvg.createSVGPoint();
  pt.x=evt.clientX; pt.y=evt.clientY;
  return pt.matrixTransform(ctm.inverse());
}
function tapMargin(){
  const vb=mapSvg.viewBox.baseVal, w=mapSvg.getBoundingClientRect().width;
  if(!w) return 34;
  return Math.max(28, Math.min(70, TAP_RADIUS_PX*(vb.width/w)));
}

mapSvg.addEventListener('click',evt=>{
  const p=toUserSpace(evt);
  if(p){
    const m=tapMargin();
    let best=null, bd=m*m;
    for(const mk of MARKERS){
      if(!activeTypes.has(mk.type)) continue;
      const d=(p.x-mk.x)*(p.x-mk.x)+(p.y-mk.y)*(p.y-mk.y);
      if(d<=bd){ bd=d; best=mk; }
    }
    if(best){ handleHit(best.el,best.name,best.type); return; }
  }
  let el=evt.target;
  while(el && el!==mapSvg){
    if(el.classList && (el.classList.contains('prov')||el.classList.contains('country'))){
      handleHit(el,el.dataset.name,el.dataset.type); return;
    }
    el=el.parentNode;
  }
});

window.addEventListener('resize',initCanvases);

initCanvases(); startGame(); heliLoop();
</script>
